const get=id=>document.getElementById(id);
async function decode(src){const image=new Image();image.src=src;await image.decode();return image}
async function start(){
const images=Object.fromEntries(await Promise.all(Object.entries(data.images).map(async ([k,v])=>[k,await decode(v)])));
const select={};
const ramps=data.ramps;
const choices={hair:['Short crop','Rounded bob'],clothing:['Tee','Cardigan'],skin:ramps.skin.map(v=>v.name),hairTone:ramps.hair.map(v=>v.name),clothTone:ramps.clothing.map(v=>v.name)};
for(const [key,values] of Object.entries(choices)){
const label=document.createElement('label');label.textContent=({hair:'Hair',clothing:'Outfit',skin:'Skin tone',hairTone:'Hair color',clothTone:'Fabric color'})[key];
const input=document.createElement('select');values.forEach((v,i)=>input.add(new Option(v,i)));select[key]=input;label.append(input);get('choices').append(label);input.onchange=compose}
const strip=document.createElement('canvas');strip.width=240;strip.height=32;
const ctx=strip.getContext('2d');const colorSlots=['shadow','midtone','highlight'];
function rgb(hex){return parseInt(hex.replace('#',''),16)}
function layer(name,category,idx){const img=images[name];const work=document.createElement('canvas');work.width=240;work.height=32;const w=work.getContext('2d');w.drawImage(img,0,0);
if(idx){const table=new Map(colorSlots.map(k=>[rgb(ramps[category][0][k]),rgb(ramps[category][idx][k])]));const pixels=w.getImageData(0,0,240,32);const p=pixels.data;
for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const v=table.get((p[i]<<16)|(p[i+1]<<8)|p[i+2]);if(v!==undefined){p[i]=v>>16;p[i+1]=(v>>8)&255;p[i+2]=v&255}}w.putImageData(pixels,0,0)}ctx.drawImage(work,0,0)}
let motion='Turnaround',time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function compose(){const val=k=>+select[k].value;const hair=val('hair')?'bob':'crop';ctx.clearRect(0,0,240,32);
layer(hair+'Back','hair',val('hairTone'));layer('body','skin',val('skin'));layer(val('clothing')?'cardigan':'tee','clothing',val('clothTone'));layer(hair+'Front','hair',val('hairTone'));
get('status').textContent=choices.hair[val('hair')]+' · '+choices.clothing[val('clothing')];draw()}
function draw(){const a=get('actor').getContext('2d'),r=get('room').getContext('2d'),d=get('detail').getContext('2d');
const f=motion==='Turnaround'?Math.floor(time/850)%4:motion==='Walk'?4+Math.floor(time/125)%4:8+Math.floor(time/(1000/3))%2;
a.clearRect(0,0,24,32);a.drawImage(strip,f*24,0,24,32,0,0,24,32);
r.drawImage(images.room,0,0);r.drawImage(strip,(8+Math.floor(time/(1000/3))%2)*24,0,24,32,27,61,24,32);r.drawImage(images.rail,31,86);
d.drawImage(get('room'),15,58,48,40,0,0,48,40)}
const buttons={};for(const m of ['Turnaround','Walk','Study']){const b=document.createElement('button');b.textContent=m;buttons[m]=b;get('motions').append(b);b.onclick=()=>{motion=m;time=0;for(const k in buttons)buttons[k].setAttribute('aria-pressed',k===m);draw()}}
buttons.Turnaround.click(); const play=get('play');function playback(){play.textContent=playing?'Pause motion':'Play motion';play.setAttribute('aria-pressed',playing)}play.onclick=()=>{playing=!playing;playback()};playback();
function fit(){const zoom=Math.max(1,Math.min(3,Math.floor(get('room').parentNode.clientWidth/320)));get('room').style.width=320*zoom+'px';get('room').style.height=192*zoom+'px'}new ResizeObserver(fit).observe(get('room').parentNode);fit();compose();
function animate(now){if(last!==null&&playing)time+=Math.min(100,now-last);last=now;draw();requestAnimationFrame(animate)}requestAnimationFrame(animate)}
start().catch(error=>{get('status').textContent='Preview could not load: '+error.message});
</script></html>
