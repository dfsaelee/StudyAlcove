<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character studio · StudyAlcove</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3e9;color:#293d35;font:15px/1.45 "Segoe UI",sans-serif}main,header>div{max-width:1250px;margin:auto;padding:0 32px}header{border-bottom:1px solid #c9cabb}header>div{display:flex;align-items:center;justify-content:space-between;height:60px}header b{font:600 23px Georgia,serif}header span,.kicker{font:600 11px/1.3 monospace;letter-spacing:.12em;text-transform:uppercase;color:#536857}h1{font:normal clamp(38px,5vw,68px)/1 Georgia,serif;letter-spacing:-.05em;margin:32px 0 26px}h2{font:normal 24px Georgia,serif;margin:0}section{min-width:0}.layout{display:grid;grid-template-columns:minmax(290px, .84fr) minmax(340px,1.5fr);gap:24px}.panel{border:1px solid #c8cabc;border-radius:14px;background:#fffcf5;overflow:hidden}.figure{display:grid;place-items:center;min-height:210px;background:#e3ece1;background-image:radial-gradient(#b8c9b7 1px,transparent 1px);background-size:12px 12px}.controls{padding:18px 22px}.controls label{display:grid;grid-template-columns:88px 1fr;align-items:center;margin:8px 0;font-weight:600}select,button{font:inherit;color:inherit;cursor:pointer}.controls select,button{border:1px solid #afb8a8;border-radius:6px;padding:6px 10px;background:#fffdf7}.viewer{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid #d9ddce}.viewer button[aria-pressed=true]{background:#43634f;border-color:#43634f;color:white}.roomhead,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px}.roomwrap,.detail{display:grid;place-items:center;background:#eae3d3;overflow:auto;padding:12px 0}.detail{background:#f0eadc;min-height:145px}.foot{font-size:13px;color:#465d4d}.reviewlinks{display:flex;gap:22px;flex-wrap:wrap;padding:20px 0 28px}a{color:#345d4a;text-underline-offset:4px}canvas{image-rendering:pixelated;display:block}#actor{width:144px;height:192px}#detail{width:192px;height:160px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #39789b;outline-offset:2px}@media(max-width:760px){.layout{grid-template-columns:1fr}main,header>div{padding:0 14px}.roomwrap{justify-content:safe center}}
</style>
<header><div><b>StudyAlcove</b><span>Library / avatar proof</span></div></header>
<main><h1>Character studio</h1><div class="layout"><section class="panel" aria-label="Avatar customization">
<div class="figure"><canvas id="actor" width="24" height="32" aria-label="Selected avatar"></canvas></div>
<div class="viewer" id="motions"></div><div class="controls" id="choices"></div></section>
<section class="panel"><div class="roomhead"><h2>Main Study Room</h2><span class="kicker">Library</span></div>
<div class="roomwrap"><canvas id="room" width="320" height="192" aria-label="Your avatar studying in the Library"></canvas></div>
<div class="foot"><b>Writing desk</b><span>Seated detail · 4×</span></div><div class="detail"><canvas id="detail" width="48" height="40" aria-label="Enlarged view of the same seated avatar"></canvas></div>
<div class="foot"><span id="status" role="status"></span><button id="play"></button></div></section></div>
<nav class="reviewlinks"><a href="previews/base-reference-4x.png">Reference comparison</a><a href="previews/four-looks.png">All four looks</a><a href="QA-REPORT.md">QA notes</a></nav>
</main><script>
const data=__DATA__;
const get=id=>document.getElementById(id);
async function decode(src){const image=new Image();image.src=src;await image.decode();return image}
async function start(){
const images=Object.fromEntries(await Promise.all(Object.entries(data.images).map(async ([k,v])=>[k,await decode(v)])));
const select={};
const ramps=data.ramps;
const choices={hair:['Short crop','Rounded bob'],clothing:['Tee','Cardigan'],skin:ramps.skin.map(v=>v.name),hairTone:ramps.hair.map(v=>v.name),clothTone:ramps.clothing.map(v=>v.name)};
for(const [key,values] of Object.entries(choices)){
const label=document.createElement('label');label.textContent=({hair:'Hair',clothing:'Outfit',skin:'Skin tone',hairTone:'Hair color',clothTone:'Fabric color'})[key];
const input=document.createElement('select');values.forEach((v,i)=>input.add(new Option(v,i)));select[key]=input;label.append(input);get('choices').append(label);input.onchange=compose}
const strip=document.createElement('canvas');strip.width=240;strip.height=32;
const ctx=strip.getContext('2d');const colorSlots=['shadow','midtone','highlight'];
function rgb(hex){return parseInt(hex.replace('#',''),16)}
function layer(name,category,idx){const img=images[name];const work=document.createElement('canvas');work.width=240;work.height=32;const w=work.getContext('2d');w.drawImage(img,0,0);
if(idx){const table=new Map(colorSlots.map(k=>[rgb(ramps[category][0][k]),rgb(ramps[category][idx][k])]));const pixels=w.getImageData(0,0,240,32);const p=pixels.data;
for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const v=table.get((p[i]<<16)|(p[i+1]<<8)|p[i+2]);if(v!==undefined){p[i]=v>>16;p[i+1]=(v>>8)&255;p[i+2]=v&255}}w.putImageData(pixels,0,0)}ctx.drawImage(work,0,0)}
let motion='Turnaround',time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function compose(){const val=k=>+select[k].value;const hair=val('hair')?'bob':'crop';ctx.clearRect(0,0,240,32);
layer(hair+'Back','hair',val('hairTone'));layer('body','skin',val('skin'));layer(val('clothing')?'cardigan':'tee','clothing',val('clothTone'));layer(hair+'Front','hair',val('hairTone'));
get('status').textContent=choices.hair[val('hair')]+' · '+choices.clothing[val('clothing')];draw()}
function draw(){const a=get('actor').getContext('2d'),r=get('room').getContext('2d'),d=get('detail').getContext('2d');
const f=motion==='Turnaround'?Math.floor(time/850)%4:motion==='Walk'?4+Math.floor(time/125)%4:8+Math.floor(time/(1000/3))%2;
a.clearRect(0,0,24,32);a.drawImage(strip,f*24,0,24,32,0,0,24,32);
r.drawImage(images.room,0,0);r.drawImage(strip,(8+Math.floor(time/(1000/3))%2)*24,0,24,32,27,61,24,32);r.drawImage(images.rail,31,86);
d.drawImage(get('room'),15,58,48,40,0,0,48,40)}
const buttons={};for(const m of ['Turnaround','Walk','Study']){const b=document.createElement('button');b.textContent=m;buttons[m]=b;get('motions').append(b);b.onclick=()=>{motion=m;time=0;for(const k in buttons)buttons[k].setAttribute('aria-pressed',k===m);draw()}}
buttons.Turnaround.click(); const play=get('play');function playback(){play.textContent=playing?'Pause motion':'Play motion';play.setAttribute('aria-pressed',playing)}play.onclick=()=>{playing=!playing;playback()};playback();
function fit(){const zoom=Math.max(1,Math.min(3,Math.floor(get('room').parentNode.clientWidth/320)));get('room').style.width=320*zoom+'px';get('room').style.height=192*zoom+'px'}new ResizeObserver(fit).observe(get('room').parentNode);fit();compose();
function animate(now){if(last!==null&&playing)time+=Math.min(100,now-last);last=now;draw();requestAnimationFrame(animate)}requestAnimationFrame(animate)}
start().catch(error=>{get('status').textContent='Preview could not load: '+error.message});
</script></html>
