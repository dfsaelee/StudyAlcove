services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: studyalcove
      POSTGRES_DB: studyalcove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or an env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyalcove -d studyalcove"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
